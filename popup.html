<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ad Blocker</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="icons/ad-blocker.png" alt="Ad Blocker Icon" class="icon">
      <h1 data-i18n="title">Ad Blocker</h1>
    </header>

    <div class="stats-section">
      <h2 data-i18n="stats">Statistics</h2>
      <div class="stat-item">
        <span data-i18n="blocked">Blocked Ads:</span>
        <span id="blockedAdsCount">0</span>
      </div>
      <div class="stat-item">
        <span data-i18n="blockedAnalytics">Blocked Analytics:</span>
        <span id="blockedAnalyticsCount">0</span>
      </div>
    </div>

    <div class="controls-section">
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="adBlockingToggle" checked>
          <span class="slider round"></span>
        </label>
        <span data-i18n="enableAdBlocking">Enable Ad Blocking</span>
      </div>
      
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="analyticsBlockingToggle" checked>
          <span class="slider round"></span>
        </label>
        <span data-i18n="enableAnalyticsBlocking">Block Analytics</span>
      </div>

      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="smartBlockingToggle" checked>
          <span class="slider round"></span>
        </label>
        <span data-i18n="enableSmartBlocking">Smart Blocking (Prevent Broken Sites)</span>
      </div>

      <div class="whitelist-controls">
        <button id="addToWhitelist" class="btn" data-i18n="addToWhitelist">Add Current Site to Whitelist</button>
        <button id="removeFromWhitelist" class="btn" data-i18n="removeFromWhitelist">Remove Current Site from Whitelist</button>
        <button id="fixBrokenSite" class="btn fix-button" data-i18n="fixBrokenSite">Fix Broken Site</button>
      </div>
    </div>

    <div class="whitelist-section">
      <h2 data-i18n="whitelist">Whitelisted Sites</h2>
      <div id="invalid-domain-message" class="notification" style="display:none;">
        <span data-i18n="invalidDomain">Extension cannot access this page.</span>
      </div>
      <ul id="whitelist" class="whitelist-domains"></ul>
    </div>

    <footer>
      <a href="options.html" target="_blank" class="options-link" data-i18n="options">Options</a>
    </footer>
  </div>
  <script src="scripts/localization.js"></script>
  <script src="scripts/popup.js"></script>
</body>
</html>
